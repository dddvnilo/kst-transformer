# Model zatvorenja sa "set" ulaznim enkoderom (studenti kao skup, proizvoljan broj studenata) -
# poredjenje sa closure_no_positional_encoding.toml.
# Jedina razlika u odnosu na closure_no_positional_encoding.toml je input_encoder.
# Pokretanje: python scripts/train.py --config configs/closure_set_encoder.toml

data = "kst_dataset_2-10items_80k_weighted.npz"
closure_loss = true
pos_encoding = "none"
input_encoder = "set"

epochs = 200
patience = 200
batch_size = 128
lr = 0.000662

d_model = 256
nhead = 8
num_layers = 3
dim_feedforward = 256
dropout = 0.1

val_ratio = 0.2
test_ratio = 0.1
seed = 42
